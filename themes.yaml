# Color palettes. Set `theme:` in profile.yaml to pick one,
# or copy one and make your own. All values are hex.
#
#   bg      window background           panel   panel background
#   border  borders                     grid    grids / thin lines
#   text    main text                   value   values
#   muted   secondary text              faint   line numbers
#   accent  primary color               accent2 secondary
#   accent3 tertiary                    accent4 fourth (gradients)
#   ok      "objective" green
#   glow    neon glow (true/false)      scanlines  CRT lines (true/false)
#   flat    solid colors, no gradients (true/false)
#   chrome  window bar: gnome (buttons on the right) | mac (traffic lights)
#   headerbar / close   title bar and close button colors (gnome only)

# ── Real terminals ──────────────────────────────────────────

# GNOME Terminal on Ubuntu (aubergine + Tango palette + Ubuntu orange)
ubuntu:
  bg: "#2c0a22"
  headerbar: "#3d1a32"
  panel: "#300a24"
  border: "#5a2d4e"
  grid: "#8c6a82"
  text: "#eeeeec"
  value: "#d3d7cf"
  muted: "#ab94a6"
  faint: "#7a5a70"
  accent: "#e95420"
  accent2: "#8ae234"
  accent3: "#fce94f"
  accent4: "#729fcf"
  ok: "#8ae234"
  close: "#e95420"
  flat: true
  chrome: gnome
  glow: false
  scanlines: false

