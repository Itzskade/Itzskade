# Rebuilds the SVGs and README whenever the data changes.
name: build-profile

on:
  push:
    paths:
      - profile.yaml
      - themes.yaml
      - README.template.md
      - generate.py
      - art/**
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC, to refresh the stats
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow
      - run: python3 generate.py --fetch-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          [ -f stats.json ] && git add stats.json
          git diff --cached --quiet || git commit -m "chore(profile): regenerate assets"
          git push
